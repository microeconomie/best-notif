name: Veille Causeries de Comptoir

on:
  schedule:
    - cron: "55 * * * *"   # toutes les 3 heures (heure UTC), décalé des trois autres
  workflow_dispatch:          # bouton "Run workflow" pour tester à la main

permissions:
  contents: write   # pour sauvegarder la liste des causeries déjà vues
  issues: write     # pour créer l'issue de notification

concurrency:
  group: veille-causeries

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Vérifier les causeries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/check_causeries.py

      - name: Sauvegarder l'état
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/causeries_seen.json
          if git diff --staged --quiet; then
            echo "Aucun changement à sauvegarder."
          else
            git commit -m "Veille Causeries : mise à jour"
            git pull --rebase
            git push
          fi
