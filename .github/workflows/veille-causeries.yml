name: Veille Causeries de Comptoir

on:
  schedule:
    - cron: "55 * * * *"    # toutes les heures (heure UTC), décalé des trois autres
  workflow_dispatch:          # bouton "Run workflow" pour tester à la main

permissions:
  contents: write   # pour sauvegarder l'état et la base consolidée
  issues: write     # pour créer l'issue de notification

concurrency:
  group: veille-causeries

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Relever les événements
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/check_causeries.py

      - name: Reconstruire la base consolidée
        run: python scripts/construire_base.py

      - name: Sauvegarder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Aucun changement à sauvegarder."
          else
            git commit -m "Veille Causeries de Comptoir : mise à jour"
            # les quatre veilles poussent sur la meme branche : on reessaie
            sauve=
            for essai in 1 2 3; do
              if git pull --rebase --quiet && git push --quiet; then
                sauve=1; echo "Sauvegarde (tentative $essai)."; break
              fi
              echo "Collision avec une autre veille, nouvelle tentative."
              sleep $((essai * 15))
            done
            [ -n "$sauve" ]
          fi
