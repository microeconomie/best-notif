name: Veille Le Briefing

on:
  schedule:
    - cron: "43 * * * *"    # toutes les heures (heure UTC), décalé des trois autres
  workflow_dispatch:          # bouton "Run workflow" pour tester à la main

permissions:
  contents: write   # pour sauvegarder l'état et la base consolidée
  issues: write     # pour créer l'issue de notification

concurrency:
  group: veille-lebriefing

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Relever les événements
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/check_lebriefing.py

      - name: Reconstruire la base consolidée
        run: python scripts/construire_base.py

      - name: Sauvegarder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Aucun changement à sauvegarder."
          else
            git commit -m "Veille Le Briefing : mise à jour"
            git pull --rebase
            git push
          fi
